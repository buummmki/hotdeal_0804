name: 핫딜 수집

# 정기 수집은 Vercel 기본 cron(vercel.json, 하루 1회)이 담당합니다.
# 이 워크플로는 "지금 당장 한 번 돌리고 싶을 때" 쓰는 수동 실행용입니다.
#
# 쓰려면 저장소 Secret 2개가 필요합니다
# (Settings → Secrets and variables → Actions):
#   SITE_URL     https://hotdeal-aggregator-dun.vercel.app   (끝에 / 없이)
#   CRON_SECRET  Vercel 환경변수에 넣은 것과 동일한 값
#
# 하루 1회보다 자주 돌리고 싶어지면 아래 schedule 주석을 풀면 됩니다.
# (Vercel Pro 로 올리지 않고 주기를 늘리는 무료 우회책)

on:
  workflow_dispatch: # Actions 탭에서 수동 실행
  # schedule:
  #   - cron: '*/20 * * * *'

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 수집 트리거
        run: |
          code=$(curl -sS -m 120 -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/crawl")
          echo "HTTP $code"
          cat /tmp/out.json || true
          echo
          test "$code" = "200"

      - name: 랭킹 재계산
        run: |
          code=$(curl -sS -m 60 -o /tmp/rescore.json -w '%{http_code}' \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            "${{ secrets.SITE_URL }}/api/cron/rescore")
          echo "HTTP $code"
          cat /tmp/rescore.json || true
