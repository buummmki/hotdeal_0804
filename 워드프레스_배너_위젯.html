<!--
  온누리 할인정보 사이드바 위젯
  ────────────────────────────────────────────────────────
  붙이는 곳: 워드프레스 관리자 → 외모 → 위젯 → Main Sidebar
             → "사용자 정의 HTML" 위젯 추가 → 아래 전체를 붙여넣기

  · 실시간으로 식품 특가 5건을 불러옵니다. 한 번 넣으면 관리 불필요.
  · 다른 카테고리를 원하면 아래 data-cat 값을 바꾸세요.
      food(식품) / life(생활·패션) / appliance(가전) / coupon(쿠폰·상품권) / all(전체)
  · 개수는 data-limit 으로 조절 (최대 10)
  · 스크립트가 막히거나 실패해도 하단 링크는 항상 보입니다.
-->
<div id="onnuri-sale-widget"
     data-cat="food"
     data-limit="5"
     style="border:1px solid #e5e7eb;border-radius:12px;overflow:hidden;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Malgun Gothic','맑은 고딕',sans-serif;">

  <div style="background:#111827;color:#fff;padding:12px 14px;">
    <div style="font-size:15px;font-weight:800;letter-spacing:-0.02em;">
      온누리 <span style="color:#f43f5e;">할인정보</span>
    </div>
    <div style="font-size:11px;color:#9ca3af;margin-top:2px;">
      오늘의 식품 특가 · 매일 갱신
    </div>
  </div>

  <div id="onnuri-sale-list" style="padding:6px 0;">
    <div style="padding:16px 14px;font-size:12px;color:#9ca3af;">불러오는 중…</div>
  </div>

  <a href="https://sale.onnuriinfo.com/food"
     target="_blank" rel="noopener"
     style="display:block;padding:11px 14px;background:#f9fafb;border-top:1px solid #e5e7eb;
            text-align:center;font-size:13px;font-weight:700;color:#f43f5e;text-decoration:none;">
    특가 전체 보기 &rsaquo;
  </a>
</div>

<script>
(function () {
  var box = document.getElementById('onnuri-sale-widget');
  var list = document.getElementById('onnuri-sale-list');
  if (!box || !list) return;

  var cat = box.getAttribute('data-cat') || 'food';
  var limit = box.getAttribute('data-limit') || 5;
  var api = 'https://sale.onnuriinfo.com/api/widget?cat=' + cat + '&limit=' + limit;

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  fetch(api)
    .then(function (r) { return r.json(); })
    .then(function (data) {
      if (!data.deals || !data.deals.length) throw new Error('empty');

      list.innerHTML = data.deals.map(function (d, i) {
        var price = d.price ? esc(d.price) : '가격 미표기';
        var ship = d.freeShipping
          ? '<span style="color:#059669;font-size:10px;margin-left:5px;">무료배송</span>' : '';
        var border = i === 0 ? '' : 'border-top:1px solid #f3f4f6;';

        return '<a href="' + esc(d.url) + '" target="_blank" rel="noopener"' +
          ' style="display:flex;gap:8px;padding:9px 14px;text-decoration:none;color:inherit;' + border + '">' +
            '<span style="flex:0 0 14px;font-size:11px;font-weight:800;color:' +
              (i < 3 ? '#f43f5e' : '#d1d5db') + ';line-height:1.5;">' + (i + 1) + '</span>' +
            '<span style="flex:1;min-width:0;">' +
              '<span style="display:block;font-size:12.5px;line-height:1.45;color:#111827;' +
                'display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">' +
                esc(d.title) + '</span>' +
              '<span style="display:block;margin-top:3px;font-size:11px;color:#6b7280;">' +
                '<b style="color:#f43f5e;">' + price + '</b>' + ship +
              '</span>' +
            '</span>' +
          '</a>';
      }).join('');
    })
    .catch(function () {
      list.innerHTML =
        '<div style="padding:14px;font-size:12px;color:#6b7280;line-height:1.6;">' +
        '커뮤니티에 올라온 식품·먹거리 특가를 모아 매일 정리합니다.<br>' +
        '장 보기 전에 한 번 확인해 보세요.</div>';
    });
})();
</script>
